name: EveryPivot Validation

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check DCO signoff trailers
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=0
          body_confirms=0
          if printf '%s\n' "$PR_BODY" | grep -Eiq '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*I signed off my contributor-authored commits, or I confirm DCO acceptance here'; then
            body_confirms=1
          fi

          for commit in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$commit" | grep -Eqi '^Signed-off-by: .+ <.+>$'; then
              echo "::warning::Commit $commit is missing a Signed-off-by trailer."
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            exit 0
          fi

          if [ "$body_confirms" -eq 1 ]; then
            echo "One or more commits are missing Signed-off-by trailers, but the PR body contains explicit DCO confirmation."
            echo "Maintainers may squash or clean up a good-faith contribution when authorship and DCO confirmation are clear."
            echo "For multi-author PRs, maintainers must confirm DCO acceptance from each contributor before merge."
            exit 0
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more commits are missing Signed-off-by trailers and the PR body does not contain DCO confirmation."
            echo "Every contributor-authored commit should be signed off where practical."
            echo "Check the DCO box in the PR template or amend commits with Signed-off-by trailers."
          fi
          exit "$missing"

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Validate corpus
        run: ruby tools/validate_pivots.rb

      - name: Validate corpus with strict metadata
        run: ruby tools/validate_pivots.rb --strict-metadata

      - name: Run fixture suite
        run: ruby tools/check_fixture_suite.rb

      - name: Run query profile suite
        run: ruby tools/check_query_profile_suite.rb

      - name: Check release metadata consistency
        run: ruby tools/check_release_metadata.rb

      - name: Check generated data freshness
        run: ruby tools/check_generated_freshness.rb

      - name: Audit static site links
        run: ruby tools/check_site_links.rb

      - name: Check homepage release snapshot agreement
        run: ruby tools/check_site_snapshot.rb

      # build_registry_index.rb derives release-manifest, patterns.tar.gz, and
      # fixtures.tar.gz alongside the --output path. The .preview. infix is
      # carried through from the registry-index.preview.json filename.
      - name: Build preview registry bundle
        run: |
          ruby tools/build_registry_index.rb \
            --repo-root . \
            --release ci-preview \
            --published-at "$(date -u +%F)" \
            --output "${RUNNER_TEMP}/registry-index.preview.json" \
            --site-data-root "${RUNNER_TEMP}/site-data"

      - name: Verify preview artifacts exist
        run: |
          missing=0
          for f in \
            "${RUNNER_TEMP}/registry-index.preview.json" \
            "${RUNNER_TEMP}/release-manifest.preview.json" \
            "${RUNNER_TEMP}/patterns.preview.tar.gz" \
            "${RUNNER_TEMP}/fixtures.preview.tar.gz"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing preview artifact: $f"
              missing=1
            else
              echo "ok: $f"
            fi
          done
          if [ ! -d "${RUNNER_TEMP}/site-data" ]; then
            echo "::error::Missing site-data directory: ${RUNNER_TEMP}/site-data"
            missing=1
          fi
          exit "$missing"

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: everypivot-preview-bundle
          path: |
            ${{ runner.temp }}/registry-index.preview.json
            ${{ runner.temp }}/release-manifest.preview.json
            ${{ runner.temp }}/patterns.preview.tar.gz
            ${{ runner.temp }}/fixtures.preview.tar.gz
            ${{ runner.temp }}/site-data

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Check release metadata matches tag
        run: ruby tools/check_release_metadata.rb --expected-release "${GITHUB_REF_NAME}"

      # build_registry_index.rb writes registry-index.json plus three derived
      # siblings (release-manifest.json, patterns.tar.gz, fixtures.tar.gz)
      # into the same directory as --output. All four are required for the
      # release upload below.
      - name: Build release artifacts
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          published_at="$(ruby tools/check_release_metadata.rb --expected-release "${GITHUB_REF_NAME}" --print-published-at)"
          ruby tools/build_registry_index.rb \
            --repo-root . \
            --release "${GITHUB_REF_NAME}" \
            --published-at "${published_at}" \
            --output "${RUNNER_TEMP}/release/registry-index.json"

      - name: Verify release artifacts exist
        run: |
          missing=0
          for f in \
            "${RUNNER_TEMP}/release/registry-index.json" \
            "${RUNNER_TEMP}/release/release-manifest.json" \
            "${RUNNER_TEMP}/release/patterns.tar.gz" \
            "${RUNNER_TEMP}/release/fixtures.tar.gz"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing release artifact: $f"
              missing=1
            else
              echo "ok: $f"
            fi
          done
          exit "$missing"

      - name: Publish GitHub release assets
        # softprops/action-gh-release@v3 pinned to the upstream v3 tag commit.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            ${{ runner.temp }}/release/registry-index.json
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/patterns.tar.gz
            ${{ runner.temp }}/release/fixtures.tar.gz
