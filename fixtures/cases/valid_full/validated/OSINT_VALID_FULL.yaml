id: OSINT_VALID_FULL
version: 1.2.3
pattern_schema_version: 1.2
validation_state: validated
precision_tier: high
robustness_class: ownership_signal
hazards:
- Shared infrastructure can reflect outsourced service providers rather than direct common ownership.
- Stale telemetry can preserve links after ownership or hosting relationships change.
capability_requirements:
  required:
  - dns_enrichment
  - asset_inventory
  optional:
  - web_fingerprinting
  - certificate_history
review:
  last_reviewed: '2026-04-03'
  review_cadence_days: 90
  next_review: '2026-07-02'
name: Valid Full Fixture Pattern
category: OSINT
description: Fully populated fixture exercising optional metadata, nested objects, and arrays.
source: inet:fqdn
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: incident_level
  subject_role: observation
  object_role: observation
hops:
- via: related_to
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - source.firstseen <= target.seen
    window_days: 365
  degree_caps:
    inet:fqdn: 200
  negative_nodes:
  - form: inet:fqdn
    list: known_shared_hosts
  provenance:
    min_unique_sources: 2
features:
- path_length
- rarity_idf
outputs:
  top_paths: 5
  include:
  - evidence_paths
  - explanation
datasets:
- pdns
- osint_web
