id: OSINT_RDAP_EMAIL_TO_DOMAINS
version: 1.0.0
pattern_schema_version: 1.4
validation_state: working_set
precision_tier: medium
robustness_class: ownership_signal
hazards:
- 'Privacy services, forwarding aliases, and shared admin mailboxes can overcluster unrelated domains.'
- 'Many registries redact or inconsistently expose email data, which can bias the visible link graph.'
capability_requirements:
  required:
  - 'rdap_enrichment'
  - 'email_normalization'
  optional:
  - 'privacy_service_suppression'
  - 'registrar_reseller_context'
review:
  last_reviewed: '2026-05-20'
  review_cadence_days: 90
  next_review: '2026-08-18'
name: RDAP Registrant Email → Domains
category: OSINT
description: Pivot by registrant email (where disclosed) to enumerate domains; filter privacy/proxy.
source: rdap:email
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: behavioural_cluster
hops:
- via: registered
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - email.created <= fqdn.created
    window_days: 1825
  degree_caps:
    rdap:email: 5000
  negative_nodes:
  - form: rdap:email
    list: privacy_protect_whois
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- rdap
