id: CTI_SAMPLE_C2_INFRA
version: 1.0.0
pattern_schema_version: 1.2
validation_state: working_set
precision_tier: medium
robustness_class: multi_hop_inference
hazards:
- 'Detonation output can include sinkholes, researcher infrastructure, or dead configs that never represented live operator control.'
- 'Shared hosting and short-lived VPS infrastructure can make malware-adjacent overlap look stronger than it is.'
capability_requirements:
  required:
  - 'malware_sandbox_summary'
  - 'sample_hash_normalization'
  optional:
  - 'passive_dns'
  - 'tls_scanning'
name: Malware Sample → Sandbox C2 → Infra (IP/FQDN)
category: CTI
description: Detonation-derived C2 infrastructure from file:bytes samples.
source: file:bytes
target: inet:ipv4|inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: sandbox_observed
  direction: out
  form: c2:endpoint
- via: resolves|connects
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  temporal:
    order:
    - sample.firstseen <= c2.firstseen <= infra.seen
    window_days: 365
  degree_caps:
    c2:endpoint: 1000
  negative_nodes:
  - form: inet:fqdn
    list: cdn_edges
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- sandbox
- siem
- pdns
- abuse_ch
