id: CTI_WEB_CONTENT_EMBEDDED_CONFIG_STRING_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
validation_state: working_set
precision_tier: low
robustness_class: multi_hop_inference
hazards:
- 'Embedded web strings can be comments, templates, copied code, analytics markers, or benign application configuration.'
- 'High-traffic or compromised sites can host unrelated embedded content, so page ownership and content provenance must stay separate.'
- 'A shared embedded config string is clustering evidence, not proof that the page owner controls malware infrastructure.'
capability_requirements:
  required:
  - web_content_collection
  - config_string_extraction
  - semantic_execution_contract_v1
  - preserved_extraction_v1
  - exact_content_hash_reproduction
  - complete_finding_history
  - scoped_control_evaluation
  optional:
  - html_comment_extraction
  - script_body_hashing
name: Web Content Embedded Config String Cluster
category: CTI
description: Find preserved resource captures containing the selected representation-qualified
  token. Retain URI identity alongside an eligible URL view; an FQDN result requires
  the actual DNS host component and its own qualification. Resource reuse does not
  establish domain compromise or ownership.
source: malware:config:string|web:content:token
target: inet:url|evidence:resource_content|inet:fqdn
assessment_mode: evidence_only
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_WEB_CONTENT_EMBEDDED_CONFIG_STRING_CLUSTER.json
  sha256: bd530b4f78b13da623c3e1d71b7a5b3798c2518533826a4b62954279a4e25b2b
hops:
- via: embedded_in_web_content
  direction: in
  form: inet:url
- via: has_host
  direction: out
  form: inet:fqdn
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- osint_web
- internet_scan_archives
- url_corpus
