id: CTI_MARKETPLACE_SOLD_DOMAIN_CERT_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_MARKETPLACE_SOLD_DOMAIN_CERT_CLUSTER.json
  sha256: df6e411b553b448fe8a952df02e35b1807b20f857f906f06dfef09e6881408ed
validation_state: working_set
precision_tier: medium
robustness_class: multi_hop_inference
hazards:
- A genuine historical reported sale may be corrected, disputed or withdrawn. Retained
  report-based leads do not establish that a sale or registration transfer occurred,
  or identify a buyer or controller.
- The exact claimed-domain-to-certificate association and actual candidate presentation
  remain separate joins. A request for another name on the certificate does not prove
  deployment of the sold domain.
- Candidate presentation uses a selected UTC period and separately supported reported-sale
  chronology. Pre-existing certificates are eligible; validity or CT discovery is
  not issuance time.
- Explicit sale-report status, certificate-class and address-class filters retain
  their distinct subjects and reasons. Source counts are documentary metadata, not
  independent corroboration.
capability_requirements:
  required:
  - semantic_evidence_v1
  - certificate_normalization
  - reported_sale_revision_evidence
  - certificate_name_correspondence
  - presentation_occurrence_and_endpoint_correspondence
  optional:
  - collection_knowledge_witnesses
  - source_classification_evidence
  - marketplace_sale_history
  - tls_scanning
  - ct_history
  - assertion_amendment_history_v1
name: Selected Historical Sale Report → Certificate-Linked Presentation Leads
category: CTI
description: Selected genuine historical reported sale, exact domain-to-certificate
  association and later candidate presentation. Pre-existing certificates are eligible;
  revisions, status and asserted chronology remain visible.
source: osint:marketplace:sale
target: inet:ipv4|inet:fqdn
assessment_mode: evidence_only
hops:
- via: selected_reported_sale_domain
  direction: out
  form: inet:fqdn
- via: explicit_certificate_name_association
  direction: out
  form: x509:cert
- via: observed_certificate_presentation
  direction: out
  form: inet:service
- via: evidenced_occurrence_endpoint
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  provenance:
    min_unique_sources: 2
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- marketplace
- tls
- ct
- pdns
