id: ADTECH_WEBAPP_SOURCEMAP_TO_ADMIN_SURFACE
version: 0.3.0
pattern_schema_version: 1.6
validation_state: working_set
precision_tier: medium
robustness_class: enumeration
hazards:
- 'Exposed JavaScript bundles and source maps can identify benign SaaS administration surfaces.'
- 'Recovered route names are evidence of application capability, not proof that the surface is used in a specific operation.'
- 'Shared SaaS vendors, CDNs, and common admin-route names can create false matches; corroborate with tenant-specific artifacts.'
capability_requirements:
  required:
  - web_fingerprinting
  - web_script_extraction
  - semantic_execution_contract_v1
  - preserved_extraction_v1
  - exact_content_hash_reproduction
  - complete_finding_history
  - scoped_control_evaluation
  optional:
  - dynamic_rendering
  - route_recovery
review:
  last_reviewed: '2026-05-26'
  review_cadence_days: 96
  next_review: '2026-08-30'
name: Webapp Source Map -> Admin Surface
category: ADTECH
description: Return source-qualified routes recovered from preserved artifacts, with
  explicit bundle/map content correspondence for referenced artifacts. An administrative
  surface additionally requires interface-role evidence; a route alone does not prove
  reachability or administration.
source: web:asset
target: web:route|web:admin:surface
assessment_mode: evidence_only
execution:
