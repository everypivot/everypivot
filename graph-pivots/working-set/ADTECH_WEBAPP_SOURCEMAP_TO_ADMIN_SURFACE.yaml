  version: '1.0'
  path: contracts/semantics/ADTECH_WEBAPP_SOURCEMAP_TO_ADMIN_SURFACE.json
  sha256: 03f4585892a9c7e7af7e18449dafbd61abbf7eca79b78ef56d9b6940c322b9c1
hops:
- via: references
  direction: out
  form: web:asset
- via: exposes_route
