id: OSINT_CRT_SH_SUBDOMAINS
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/OSINT_CRT_SH_SUBDOMAINS.json
  sha256: e03f3b9f81d9430c4bb73696fe1b2b703c45064316db8f4333f0bb008db4a9f6
validation_state: working_set
precision_tier: medium
robustness_class: enumeration
hazards:
- CT certificate or precertificate fields support explicit name associations, not
  DNS resolution, live service, ownership or control.
- Literal wildcard entries are separately typed scope clues. They do not enumerate
  guessed children or suppress concrete names explicitly recorded alongside them.
- The selected UTC period follows the supported CT-record event meaning. Validity,
  domain creation, receipt and replay do not substitute for that record occurrence.
- Shared-CDN or hosting classification is retained as source-qualified context; exclusion
  is explicitly selected and cannot be inferred from wildcard presence, SAN count
  or issuer labels.
capability_requirements:
  required:
  - semantic_evidence_v1
  - certificate_normalization
  - ct_record_occurrence_and_name_correspondence
  - typed_ct_name_scope
  optional:
  - collection_knowledge_witnesses
  - source_classification_evidence
  - ct_history
review:
  last_reviewed: '2026-05-26'
  review_cadence_days: 93
  next_review: '2026-08-27'
name: CT Records → Explicit Names and Separate Wildcard Clues
category: OSINT
description: Explicit names and separately typed wildcard clues from source-bound
  CT records in the chosen record-occurrence period. No wildcard expansion, DNS answer
  or service presentation is inferred.
source: inet:fqdn
target: inet:fqdn|evidence:ct_wildcard_scope
assessment_mode: evidence_only
hops:
- via: ct_name_scope_record
  direction: out
  form: x509:ct_record
- via: explicit_typed_certificate_name
  direction: out
  form: inet:fqdn|evidence:ct_wildcard_scope
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- ct
