id: CTI_C2_CERT_TO_SAMPLE_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_C2_CERT_TO_SAMPLE_CLUSTER.json
  sha256: 45465eabb9136cf39a864c303e9b37de198905c441a1d85a7dc4a157e0588b57
validation_state: working_set
precision_tier: medium
robustness_class: multi_hop_inference
hazards:
- An attributable sample-associated certificate encounter and a separately supported
  endpoint-mediated lead have different claims. A scanner observation or report co-mention
  cannot supply an encounter.
- Exact whole-artifact sample identity, actual sample execution/connection attribution,
  certificate role and service or explicitly narrower address correspondence remain
  required.
- The selected UTC period concerns established finding availability in a named collection
  with preserved history. Old activity remains old, and replay or renamed normalized
  records do not refresh an equivalent finding.
- Shared material, laboratory provenance and the C2 label establish no malicious function,
  common actor, control, confidence or accepted assessment. Controlled-occurrence
  and shared-certificate exclusions are explicit query choices.
capability_requirements:
  required:
  - semantic_evidence_v1
  - certificate_normalization
  - whole_artifact_identity
  - attributable_sample_connection_evidence
  - finding_history_v1
  optional:
  - collection_knowledge_witnesses
  - source_classification_evidence
  - malware_sandbox_summary
  - tls_scanning
  - controlled_occurrence_evidence
name: Certificate Encounter or Endpoint-Mediated Lead → Sample Findings
category: CTI
description: Collection-scoped first availability of separately supported sample encounters
  and endpoint-mediated leads. Actual event dates remain separate; a later scan alone
  is never a sample encounter.
source: x509:cert
target: file:bytes
assessment_mode: evidence_only
hops:
- via: observed_certificate_presentation
  direction: out
  form: inet:service
- via: attributable_sample_encounter_or_declared_endpoint_lead
  direction: in
  form: file:bytes
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- sandbox
- tls_scans
- pdns
