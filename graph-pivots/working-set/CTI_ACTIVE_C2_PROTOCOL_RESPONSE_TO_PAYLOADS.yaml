id: CTI_ACTIVE_C2_PROTOCOL_RESPONSE_TO_PAYLOADS
version: 3.0.0
pattern_schema_version: 1.6
validation_state: working_set
precision_tier: medium
robustness_class: multi_hop_inference
hazards:
- 'Decoded payloads can be generated by sandboxes, decoys, replay services, or defensive research infrastructure.'
- 'A payload returned by a controller can be ephemeral and may not remain available for later verification.'
- 'Protocol response reuse links observations, but it does not prove common operator control.'
capability_requirements:
  required:
  - active_protocol_probe_result_normalization
  - payload_decoding
  - semantic_execution_contract_v1
  - preserved_extraction_v1
  - exact_content_hash_reproduction
  - complete_finding_history
  - scoped_control_evaluation
  optional:
  - sample_hashing
  - payload_family_classification
name: Active C2 Protocol Response -> Payloads
category: CTI
description: Return preserved payload or configuration bytes evidenced as recovered
  from a particular protocol response. Direct configuration, payload-derived configuration
  and the payload hash have explicit bindings; a marker alone does not classify bytes
  or prove maliciousness.
source: network:service:probe_response
target: malware:payload|file:hash|malware:config
assessment_mode: evidence_only
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_ACTIVE_C2_PROTOCOL_RESPONSE_TO_PAYLOADS.json
  sha256: d14e09a0f11eb4b7c682b8eae04e61d6a8c21fb9227d104229fe169ec31361cf
hops:
- via: contains_payload
  direction: out
  form: malware:payload
- via: hashes_to
  direction: out
  form: file:hash
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- active_discovery_results
- malware_analysis
- file_reputation
