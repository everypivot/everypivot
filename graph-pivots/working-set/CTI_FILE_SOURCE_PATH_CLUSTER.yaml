id: CTI_FILE_SOURCE_PATH_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
validation_state: working_set
precision_tier: low
robustness_class: enumeration
hazards:
- 'Source paths can be copied, templated, localized, redacted, or produced by common build systems.'
- 'Paths can contain user names, project names, or sensitive local filesystem details and require minimization before publication.'
- 'A shared source path is build-context evidence, not actor attribution.'
capability_requirements:
  required:
  - file_metadata_extraction
  - path_normalization
  - semantic_execution_contract_v1
  - preserved_extraction_v1
  - exact_content_hash_reproduction
  - complete_finding_history
  - scoped_control_evaluation
  optional:
  - pdb_path_extraction
  - sample_prevalence_enrichment
name: File Source Path Cluster
category: CTI
description: Find particular preserved files with a source-qualified extraction of
  the selected path representation. The 365-day window uses first complete finding
  availability; later analysis neither invents a new file sighting nor backdates path
  knowledge.
source: file:source_path
target: file:hash
assessment_mode: evidence_only
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_FILE_SOURCE_PATH_CLUSTER.json
  sha256: 8c9d1c52d1e2cb557264cf3aaf72a52302998adfe05ce5242b76fcebd000857c
hops:
- via: embedded_in_file
  direction: in
  form: file:hash
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- malware_analysis
- file_reputation
- endpoint_telemetry
