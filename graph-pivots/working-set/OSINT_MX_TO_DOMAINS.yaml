id: OSINT_MX_TO_DOMAINS
version: 1.0.0
pattern_schema_version: 1.2
validation_state: working_set
precision_tier: low
robustness_class: enumeration
hazards:
- 'Managed mail providers serve millions of unrelated tenants; a shared MX is not a shared operator.'
- 'MX records reflect mail-routing configuration, not domain ownership or operator control.'
- 'Email forwarding and DNS-default providers create wide-degree MX clusters that should not be interpreted as adversary infrastructure.'
capability_requirements:
  required:
  - 'dns_public_lookup'
  - 'dns_mx_lookup'
  optional:
  - 'passive_dns'
  - 'managed_mail_provider_suppression'
name: Mail Exchanger → Domains
category: OSINT
description: Find domains pointing to a specific MX; helps detect mass-hosted kits or throwaway mail setups.
source: inet:fqdn:mx
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: mx_for
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - mx.seen <= fqdn.seen
    window_days: 1825
  degree_caps:
    inet:fqdn:mx: 5000
  negative_nodes:
  - form: inet:fqdn:mx
    list: public_mx_providers
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- pdns
