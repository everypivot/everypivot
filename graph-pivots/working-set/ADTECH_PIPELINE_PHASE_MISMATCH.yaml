id: ADTECH_PIPELINE_PHASE_MISMATCH
version: 0.3.0
pattern_schema_version: 1.6
validation_state: working_set
precision_tier: low
robustness_class: multi_hop_inference
hazards:
- Domain names often reflect legacy product names rather than current ad-pipeline
  function.
- Some exchanges intentionally reuse event, prebid, or creative endpoints across multiple
  phases.
- Shared vendors, CDNs, redirects, and common tracking endpoints can create false
  phase mismatches; corroborate with observed request flow.
capability_requirements:
  required:
  - web_request_telemetry
  - endpoint_role_classification
  - semantic_execution_contract_v1
  - preserved_request_correspondence
  - source_qualified_endpoint_roles
  - exact_content_hash_reproduction
  - scoped_control_evaluation
  optional:
  - web_fingerprinting
  - phase_classification
name: Ad Pipeline Phase Mismatch
category: ADTECH
description: Compare one actual request phase with source-qualified endpoint roles
  under an explicit preserved rule. Mismatch, compatible and contested witnesses remain
  distinct; no accepted risk assessment is constructed.
source: http:request
target: risk:observation|evidence:phase_comparison
assessment_mode: evidence_only
hops:
- via: yields_evidence_for
  direction: out
  form: risk:observation|evidence:phase_comparison
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- browser_telemetry
- proxy_logs
- adtech_logs
- url_corpus
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/ADTECH_PIPELINE_PHASE_MISMATCH.json
  sha256: 855983c7cb4052fc9b2f4e1620140b546ed38ae40774f48c6fd0de3b4e6d3a77
