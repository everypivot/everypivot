id: OSINT_CERT_TO_SERVERS
version: 1.0.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- 'Managed certificates and shared load balancers can join unrelated hosts behind the same delivery surface.'
- 'CT and scanner coverage can be incomplete or stale, so absence should not be interpreted as disproof.'
capability_requirements:
  required:
  - 'tls_scanning'
  - 'certificate_normalization'
  optional:
  - 'ct_history'
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: X.509 SPKI/Cert → Servers (IP/FQDN)
category: OSINT
description: Enumerate servers that present an identical certificate or SPKI (public key).
source: x509:cert
target: inet:ipv4|inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: observation
hops:
- via: presented_at
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  temporal:
    order:
    - cert.not_before <= host.seen
    window_days: 825
  degree_caps:
    x509:cert: 10000
  negative_nodes:
  - form: x509:cert
    list: letsencrypt_mass_certificates
  - form: inet:ipv4
    list: cdn_edges
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- ct
- tls
