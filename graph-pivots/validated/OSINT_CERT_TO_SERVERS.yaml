id: OSINT_CERT_TO_SERVERS
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/OSINT_CERT_TO_SERVERS.json
  sha256: 4089cee02f6bfde495b13dd0b1ca5ced17487e7d3e1387545970ef87b5e2dc77
validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- 'Managed certificates and shared load balancers can join unrelated hosts behind the same delivery surface.'
- 'CT and scanner coverage can be incomplete or stale, so absence should not be interpreted as disproof.'
- 'Certificate name fields and CT/precertificate records do not establish network presentation; supplied source assertions remain source-qualified.'
- 'Presentation inquiries require case-selected UTC dates. Certificate validity, receipt and reprocessing do not refresh presentation time.'
- 'Source and address class exclusions are explicit contract query policies; missing or conflicting classification is not clearance.'
capability_requirements:
  required:
  - 'certificate_normalization'
  - 'semantic_evidence_v1'
  optional:
  - 'tls_scanning'
  - 'ct_history'
  - 'presentation_occurrence_and_name_correspondence'
  - 'collection_knowledge_witnesses'
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: Certificate Identity or Explicit SPKI Reuse → Observed Servers
category: OSINT
description: Return IPv4 addresses or FQDNs linked to an actual certificate presentation occurrence. Whole-certificate identity and explicitly selected SPKI reuse remain distinct; a renewed certificate sharing a key is a different certificate.
source: x509:cert
target: inet:ipv4|inet:fqdn
assessment_mode: evidence_only
hops:
- via: observed_certificate_presentation
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- ct
- tls
