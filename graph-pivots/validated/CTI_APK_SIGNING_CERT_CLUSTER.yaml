validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- 'Shared OEM, test, default or repackaging credentials can link unrelated APKs without establishing a malware family or common developer.'
- 'Certificate presence, reported signer association and a scoped source-reported check are distinct claims; this evaluator does not perform cryptographic signature verification.'
- 'Whole-artifact, scheme-covered content, whole-certificate, SPKI and issuer/serial identities are distinct. Reuse establishes neither publisher trust, control, common ownership nor accepted assessment.'
- 'Only an actual complete-finding establishment in the supplied collection history is dated. Reprocessing, receipt, validity dates and new sightings do not renew an older finding.'
- 'Credential class is retained as context by default. Explicit selected class policies preserve unknown and conflicting evidence; a public certificate does not establish public access to its private key.'
- 'Correction and withdrawal context is retained without replacing or refreshing the historical finding; absence of a supplied amendment does not establish maintained current support.'
capability_requirements:
  required:
  - 'semantic_evidence_v1'
  - 'typed_artifact_and_material_identity'
  - 'source_qualified_signing_or_digest_evidence'
  - 'collection_finding_history'
  - 'scoped_amendment_context'
  optional:
  - 'apk_signature_extraction'
  - 'scoped_signature_verification_reports'
  - 'credential_classification_with_revision'
  - 'collection_knowledge_witnesses'
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: Certificate Identity or Explicit SPKI → APK Artifact Findings
category: CTI
description: 'Return case-period complete findings connecting an exact source-reported APK artifact to certificate presence, a reported signer, or a scoped source-reported verification check. Whole-certificate identity is distinct from deliberately selected SPKI reuse; actual role, artifact bytes identity and evidence remain attached.'
source: x509:cert
target: file:bytes
assessment_mode: evidence_only
hops:
- via: witnessed_in_artifact
  direction: out
  form: file:bytes
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- sandbox
- osint_web
