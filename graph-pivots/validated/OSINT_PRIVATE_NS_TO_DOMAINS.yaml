id: OSINT_PRIVATE_NS_TO_DOMAINS
version: 1.0.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: high
robustness_class: ownership_signal
hazards:
- 'White-label DNS resellers and managed hosting can create shared private nameservers for unrelated customers.'
- 'Delegation records can remain stale after migrations, parking, or account turnover.'
capability_requirements:
  required:
  - 'passive_dns'
  - 'delegation_resolution'
  optional:
  - 'whois_rdap'
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: Private Authoritative NS → Domains
category: OSINT
description: Enumerate domains delegated to a non‑provider (private) authoritative nameserver.
source: inet:fqdn:ns
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: behavioural_cluster
hops:
- via: authoritative_for
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - ns.seen <= fqdn.seen
    window_days: 1825
  degree_caps:
    inet:fqdn:ns: 10000
  negative_nodes:
  - form: inet:fqdn:ns
    list: public_ns_providers
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- pdns
