id: CROSS_CLOUD_BUCKET_TO_DOMAINS
version: 1.0.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: high
robustness_class: ownership_signal
hazards:
- 'Shared agency, reseller, or CDN-managed buckets can legitimately host unrelated domains.'
- 'Stale CNAME or bucket references can persist after ownership or hosting changes.'
capability_requirements:
  required:
  - 'passive_dns'
  - 'cloud_bucket_resolution'
  optional:
  - 'web_fingerprinting'
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: Cloud Object Bucket → Domains
category: CROSS
description: Cluster domains/CNAMEs pointing to the same object storage bucket (S3/GCS/Azure).
source: cloud:bucket
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: behavioural_cluster
hops:
- via: referenced_by
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - bucket.firstseen <= fqdn.seen
    window_days: 1825
  degree_caps:
    cloud:bucket: 20000
  negative_nodes:
  - form: cloud:bucket
    list: public_cdn_buckets
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- pdns
- osint_web
