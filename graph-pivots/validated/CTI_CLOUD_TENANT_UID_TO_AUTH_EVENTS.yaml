id: CTI_CLOUD_TENANT_UID_TO_AUTH_EVENTS
version: 1.1.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: low
robustness_class: enumeration
hazards:
- 'Cloud tenant pivots can cross administrative, customer, service-principal, guest-user, shared-service, and multi-tenant application boundaries.'
- 'Auth events can be generated by service principals, automation, health checks, delegated access, and federation flows rather than direct user action.'
- 'A tenant-to-auth-event relationship is control-plane context, not ownership, compromise, or actor attribution without corroborating evidence.'
- 'Provider, demo, and synthetic-or-healthcheck tenants/events inflate fan-out and must be suppressed via the published negative-node lists rather than presented as normal user traversals.'
- 'Stale or historical auth-event context outside the temporal window is not current access; downstream systems must treat it as audit or lifecycle context, not active session evidence.'
capability_requirements:
  required:
  - 'cloud_tenant_uid_normalization'
  - 'cloud_auth_event_telemetry'
  optional:
  - 'service_principal_classification'
  - 'guest_user_context'
review:
  last_reviewed: '2026-06-01'
  review_cadence_days: 90
  next_review: '2026-08-30'
name: Cloud Tenant UID -> Auth Events
category: CTI
description: Pivot from a normalized cloud tenant identifier to authentication events observed within that tenant context. First-hop single-step scope; associated-session multi-hop expansion remains deferred for a separate review.
source: cloud:tenant:uid
target: auth:event
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: observation
hops:
- via: contains_auth_event
  direction: out
  form: auth:event
constraints:
  temporal:
    order:
    - tenant.observed <= auth_event.observed
    window_days: 30
  degree_caps:
    cloud:tenant:uid: 100000
    auth:event: 1000000
  negative_nodes:
  - form: auth:event
    list: synthetic_or_healthcheck_auth_events
  - form: identity:user:uid
    list: guest_or_service_principal_accounts
  - form: cloud:tenant:uid
    list: multi_tenant_provider_or_demo_tenants
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- principal_role
- tenant_relationship
- novelty_flag
outputs:
  top_paths: 10
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- cloud_audit_logs
- auth_logs
- identity
