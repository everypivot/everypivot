id: SUPPLY_CODESIGN_CERT_TO_PACKAGES
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/SUPPLY_CODESIGN_CERT_TO_PACKAGES.json
  sha256: 1e05f7813abd010591ed5ec4ad858eeaada9a722e54113a4eb897632f3e81375
validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- 'Shared signing services and release pipelines can link unrelated products; signing reuse does not establish source provenance, maintainer identity or current signing control.'
- 'Filename, version text or a current download URL cannot substitute for the exact artifact/version join. Detached, catalogue and manifest evidence retains the actual covered object rather than transferring a signature to every member.'
- 'Certificate presence, reported signer association and a scoped source-reported check are distinct claims; this evaluator does not perform cryptographic signature verification.'
- 'Whole-artifact, scheme-covered content, whole-certificate, SPKI and issuer/serial identities are distinct. Reuse establishes neither publisher trust, control, common ownership nor accepted assessment.'
- 'Only an actual complete-finding establishment in the supplied collection history is dated. Reprocessing, receipt, validity dates and new sightings do not renew an older finding.'
- 'Credential class is retained as context by default. Explicit selected class policies preserve unknown and conflicting evidence; a public certificate does not establish public access to its private key.'
- 'Correction and withdrawal context is retained without replacing or refreshing the historical finding; absence of a supplied amendment does not establish maintained current support.'
capability_requirements:
  required:
  - 'semantic_evidence_v1'
  - 'typed_artifact_and_material_identity'
  - 'source_qualified_signing_or_digest_evidence'
  - 'collection_finding_history'
  - 'scoped_amendment_context'
  - 'exact_distribution_artifact_mapping'
  optional:
  - 'code_signing_certificate_extraction'
  - 'scoped_signature_verification_reports'
  - 'package_registry_history'
  - 'credential_classification_with_revision'
  - 'collection_knowledge_witnesses'
review:
  last_reviewed: '2026-05-14'
  review_cadence_days: 90
  next_review: '2026-08-12'
name: Certificate Identity or Explicit SPKI → Package Artifact Findings
category: SUPPLY
description: 'Return case-period complete findings through an exact certificate-to-artifact-to-package/version connection, retaining ecosystem, namespace and distribution variant. Certificate presence, reported signer and scoped source-reported check purposes remain distinct; an installer finding does not establish that an entire version or product is signed.'
source: x509:cert
target: it:prod:softver
assessment_mode: evidence_only
hops:
- via: witnessed_in_artifact
  direction: out
  form: file:bytes
- via: distributed_as
  direction: out
  form: it:prod:softver
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- package_registry
- binary_metadata
