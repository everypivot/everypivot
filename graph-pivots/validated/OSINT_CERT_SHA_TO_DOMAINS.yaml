id: OSINT_CERT_SHA_TO_DOMAINS
version: 1.0.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- 'Managed certificates and shared web hosts can create benign overlap between unrelated domains.'
- 'Scanner lag and historical cert retention can preserve stale domain relationships after rotation.'
capability_requirements:
  required:
  - 'tls_scanning'
  - 'certificate_normalization'
  optional:
  - 'ct_history'
review:
  last_reviewed: '2026-05-14'
  review_cadence_days: 90
  next_review: '2026-08-12'
name: Cert SHA/SPKI → Domains
category: OSINT
description: Pivot by identical certificate hash/SPKI to enumerate domains presenting the same cert.
source: x509:cert
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: observation
hops:
- via: presented_at
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - cert.not_before <= fqdn.seen
    window_days: 825
  degree_caps:
    x509:cert: 10000
  negative_nodes:
  - form: x509:cert
    list: letsencrypt_mass_certificates
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- ct
- tls
