id: OSINT_RDP_CERT_THUMBPRINT_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/OSINT_RDP_CERT_THUMBPRINT_CLUSTER.json
  sha256: 43b7fa68c13650a1dc478821394d2e633b164f20134fa81335b3dc9e9498b5e4
validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- Default images, cloned deployments, gateways and NAT can create shared certificate
  observations without common host identity or control.
- The pattern requires actual RDP presentation of the selected whole certificate.
  Generic TLS presentation, a certificate name or SPKI reuse cannot substitute.
- The analyst/case selects an inclusive UTC presentation period. Receipt, reprocessing
  and certificate validity do not refresh the observed occurrence.
- An explicitly selected CDN-address filter applies only through evidenced correspondence
  to the same occurrence; unknown or conflicting membership is not clearance.
capability_requirements:
  required:
  - semantic_evidence_v1
  - certificate_normalization
  - rdp_presentation_occurrence_and_endpoint_correspondence
  optional:
  - collection_knowledge_witnesses
  - source_classification_evidence
  - rdp_scanning
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: Exact Certificate Identity → Observed RDP Endpoints
category: OSINT
description: Exact selected whole-certificate identity on actual RDP presentations
  in the selected occurrence period; no TLS-only, endpoint-control or current-use
  inference.
source: x509:cert
target: inet:ipv4|inet:fqdn
assessment_mode: evidence_only
hops:
- via: observed_rdp_certificate_presentation
  direction: out
  form: inet:service
- via: evidenced_occurrence_endpoint
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- shodan_censys
- tls
