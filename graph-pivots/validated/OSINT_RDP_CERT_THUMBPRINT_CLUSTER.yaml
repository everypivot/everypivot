id: OSINT_RDP_CERT_THUMBPRINT_CLUSTER
version: 1.0.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: high
robustness_class: exact_cryptographic
hazards:
- 'Default appliance images or cloned deployments can reuse RDP certificates across otherwise unrelated systems.'
- 'Scanner bias, NAT, or protocol gateways can distort the apparent size of a cluster.'
capability_requirements:
  required:
  - 'rdp_scanning'
  - 'certificate_normalization'
  optional:
  - 'asset_allowlists'
review:
  last_reviewed: '2026-04-04'
  review_cadence_days: 90
  next_review: '2026-07-03'
name: RDP TLS Certificate → Host Cluster
category: OSINT
description: Cluster RDP endpoints presenting the same TLS certificate thumbprint.
source: x509:cert
target: inet:ipv4|inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: behavioural_cluster
hops:
- via: rdp_presented_at
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  temporal:
    order:
    - cert.not_before <= host.seen
    window_days: 730
  degree_caps:
    x509:cert: 5000
  negative_nodes:
  - form: inet:ipv4
    list: cdn_edges
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- shodan_censys
- tls
