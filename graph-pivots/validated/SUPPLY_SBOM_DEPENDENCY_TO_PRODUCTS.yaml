id: SUPPLY_SBOM_DEPENDENCY_TO_PRODUCTS
version: 1.1.0
pattern_schema_version: 1.4
validation_state: validated
precision_tier: low
robustness_class: enumeration
hazards:
- Common transitive dependencies, vendored packages, and version-range drift can make SBOM links overstate actual exposure.
- Corroborate dependency reachability with product version, build metadata, and exploitability context; dependency presence alone is not compromise.
- Ubiquitous base libraries inflate downstream-consumer fan-out and must be suppressed via the ubiquitous_base_libraries negative-node list rather than presented as positive clusters.
- Stale or historical SBOM-declared dependencies are not current exposure; downstream systems must treat them as audit or lifecycle context, not runtime confidence.
capability_requirements:
  required:
  - 'sbom_ingestion'
  - 'dependency_graph_resolution'
  optional:
  - 'package_metadata_collection'
  - 'version_range_resolution'
review:
  last_reviewed: '2026-06-01'
  review_cadence_days: 90
  next_review: '2026-08-30'
name: Dependency -> Downstream Product Exposure
category: SUPPLY
description: Enumerate downstream products inheriting exposure through an SBOM-declared dependency relationship.
source: it:prod:softver
target: it:prod:softver
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
  subject_role: behavioural_cluster
  object_role: observation
hops:
- via: depended_on_by
  direction: out
  form: it:prod:softver
constraints:
  temporal:
    order:
    - dependency.seen <= product.seen
    window_days: 3650
  degree_caps:
    it:prod:softver: 50000
  negative_nodes:
  - form: it:prod:softver
    list: ubiquitous_base_libraries
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- sbom
- package_registry
- vuln_db
