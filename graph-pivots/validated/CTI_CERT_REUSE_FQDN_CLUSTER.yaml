hazards:
- Whole-certificate identity and exact SPKI reuse are separate comparisons; renewal
  with the same key does not preserve the whole certificate.
- The explicitly selected older seed relationship remains reference evidence. A name
  association does not become a seed presentation, and neither leg proves simultaneous
  use or common ownership.
- Candidate presentation uses an analyst/case-selected UTC period. Certificate validity,
  first inventory, receipt and reprocessing do not substitute for that occurrence.
- Intermediate certificate-class exclusions require an explicit selected filter; unknown
  or conflicting class evidence is not clearance, and independent qualifying paths
  remain.
capability_requirements:
