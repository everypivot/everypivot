id: IO_CONTENT_HASH_TO_ACCOUNT_CLUSTER
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: insufficient_hazards
precision_tier: exploratory
capability_requirements:
  required:
  - 'platform_abuse_records'
  - 'content_fingerprinting'
  optional:
  - 'social_profile_collection'
  - 'campaign_context_enrichment'
hazards:
- Stock media, memes, templates, and reposted documents can be common across unrelated accounts.
- Corroborate exact content-hash reuse with timing, behavior, and campaign context; identical media alone is not common control.
- Public datasets, moderation queues, analyst uploads, and training artifacts can reproduce hashes and must remain suppressible.
name: Content Hash -> Account Cluster
category: IO
description: Cluster coordinated accounts reusing identical media assets, documents, or attachments across posts and campaigns.
source: hash:sha256
target: inet:web:acct
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: posted_by|used_by
  direction: out
  form: inet:web:acct
constraints:
  temporal:
    order:
    - content.firstseen <= account.seen
    window_days: 365
  degree_caps:
    hash:sha256: 5000
  negative_nodes:
  - form: hash:sha256
    list: stock_media_hashes
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- social
- osint_web
