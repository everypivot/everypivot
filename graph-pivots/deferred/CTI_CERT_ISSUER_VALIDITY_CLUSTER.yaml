id: CTI_CERT_ISSUER_VALIDITY_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_CERT_ISSUER_VALIDITY_CLUSTER.json
  sha256: cc241322d7d212088a5a7822294240d2b96aaf56c569b63905074a3c077159ec
validation_state: deferred
deferred_reason: needs_fixtures
precision_tier: low
robustness_class: multi_hop_inference
hazards:
- The preserved identified profile declares every compared field, exact value or inclusive
  range and definition revision. A sparse search does not authorize silent broadening
  or a similarity fallback.
- Matching subject or issuer labels and declared validity duration do not establish
  certificate/key identity, actual issuer identity, ACME issuance, deployment lifetime,
  maliciousness or common control.
- The same identified matching certificate must be carried into an actual service
  presentation. CT-only names, copied fields or nearby endpoints do not supply the
  join.
- The analyst/case-selected UTC presentation period is independent of profile duration
  criteria, profile creation, receipt and analytical knowledge. Presentation outside
  declared certificate validity is retained.
- Common/default/managed and infrastructure classifications are separate source-qualified
  context. Exclusions require explicit scoped policies; unknown or conflicting evidence
  is not clearance.
capability_requirements:
  required:
  - semantic_evidence_v1
  - certificate_normalization
  - preserved_certificate_profile_v1
  - source_bound_certificate_fields
  - presentation_occurrence_and_endpoint_correspondence
  optional:
  - collection_knowledge_witnesses
  - source_classification_evidence
  - tls_scanning
  - certificate_transparency
name: Explicit Issuer and Validity Profile → Certificate Presentations
category: CTI
description: Presentation of an actual identified certificate meeting an explicitly
  preserved issuer_validity profile; profile revision, field criteria and candidate
  occurrence period remain distinct.
source: x509:comparison_profile
target: inet:ipv4|inet:fqdn
assessment_mode: evidence_only
hops:
- via: explicit_profile_matches
  direction: out
  form: x509:cert
- via: observed_certificate_presentation
  direction: out
  form: inet:service
- via: evidenced_occurrence_endpoint
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- tls
- ct
