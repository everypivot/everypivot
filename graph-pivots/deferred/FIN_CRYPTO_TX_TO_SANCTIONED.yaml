hazards:
- Blockchain heuristics can over-attribute flows through mixers, exchanges, bridges,
  or shared custody accounts.
- Sanctions lists and address clusters are temporal; corroborate transaction timing
  and ownership before drawing compliance conclusions.
- Compliance, exchange, and customer-identification evidence may be regulated or restricted
  and must be governed before use.
- Source-reported identity, relationship and list status require separate evidence;
  no traversal supplies legal exposure, liability, control, source independence or
  accepted assessment status.
- A selected historical-status inquiry requires the actual applicable relationship
  and list intervals. Later publication, receipt and correction do not backdate analyst
  knowledge or refresh activity.
name: Crypto Transaction → Referenced Sanctions Entries
