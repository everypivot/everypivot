id: AITS_ABUSE_LANDING_DOMAIN_CLUSTER
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: restricted_data_access
precision_tier: exploratory
capability_requirements:
  required:
  - 'restricted_records'
  - 'platform_abuse_records'
  - 'domain_normalization'
  optional:
  - 'web_fingerprinting'
  - 'account_behavior_context'
hazards:
- Shared affiliate, linkhub, or staging domains can connect unrelated abuse accounts and create false positives.
- Landing-domain reuse should be corroborated with account behavior, timing, and platform abuse evidence; access to account evidence may be privacy-restricted.
name: Abuse Landing Domain -> Account Cluster
category: AITS
description: Link external landing, monetization, or staging domains reused by abusive account clusters.
source: inet:fqdn
target: inet:web:acct
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: promoted_by|referenced_by
  direction: out
  form: web:url|file:bytes
- via: used_by
  direction: out
  form: inet:web:acct
constraints:
  temporal:
    order:
    - fqdn.seen <= artifact.seen <= account.seen
    window_days: 365
  degree_caps:
    inet:fqdn: 5000
  negative_nodes:
  - form: inet:fqdn
    list: mainstream_affiliate_and_linkhub_domains
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- platform_abuse
- osint_web
