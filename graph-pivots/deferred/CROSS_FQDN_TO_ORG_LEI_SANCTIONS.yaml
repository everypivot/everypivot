  - registrar_reseller_context
hazards:
- RDAP registrants may be privacy-proxied, stale, reseller-owned, common service providers,
  or same-name collisions rather than the domain controller.
- LEI and sanctions joins are temporal; corroborate current registration evidence
  and avoid treating intermediary links as direct control.
- Source-reported identity, relationship and list status require separate evidence;
  no traversal supplies legal exposure, liability, control, source independence or
  accepted assessment status.
- A selected historical-status inquiry requires the actual applicable relationship
  and list intervals. Later publication, receipt and correction do not backdate analyst
  knowledge or refresh activity.
name: Domain → Reported Organization → Sanctions Entries
category: CROSS
description: Follow a dated source-reported domain/organization relationship and explicit
  legal-entity correspondence to selected sanctions entry revisions. Preserve the
  relationship role and period; domain association does not establish ownership or
  liability.
