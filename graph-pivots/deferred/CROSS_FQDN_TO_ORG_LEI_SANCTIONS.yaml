deferred_reason: missing_negative_controls
precision_tier: exploratory
capability_requirements:
  required:
  - rdap_enrichment
  - lei_resolution
  - sanctions_list_access
  - semantic_execution_contract_v1
  - source_revision_scoped_relations
  - explicit_temporal_applicability
