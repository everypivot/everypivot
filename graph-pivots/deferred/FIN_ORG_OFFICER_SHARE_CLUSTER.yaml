id: FIN_ORG_OFFICER_SHARE_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
validation_state: deferred
deferred_reason: restricted_data_access
precision_tier: exploratory
capability_requirements:
  required:
  - financial_records
  - identity_records
  - semantic_execution_contract_v1
  - scoped_identity_correspondence
  - source_qualified_appointment_service
  - scoped_control_evaluation
  optional:
  - officer_record_normalization
  - company_registry_context
hazards:
- Common names, jurisdictional identifiers and stale registry data require exact person/organization/appointment
  scope.
- Professional, nominee and capacity classifications attach to the particular appointment;
  they do not exclude the whole person.
- Separate historical appointments need not overlap and do not establish shell companies,
  beneficial ownership or control.
name: Org Officer/Director → Cross‑Directorship Cluster
category: FIN
description: Find organizations connected by directly evidenced officer/director appointments
  of the selected person within an explicit service scope. Preserve historical and
  nonconcurrent appointments without co-appointee expansion, shell-network or control
  inference.
source: person
target: org:org
assessment_mode: evidence_only
hops:
- via: officer_of|director_of
  direction: out
  form: org:org
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- opencorp
