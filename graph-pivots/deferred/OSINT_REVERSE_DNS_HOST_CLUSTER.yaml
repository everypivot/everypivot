id: OSINT_REVERSE_DNS_HOST_CLUSTER
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: insufficient_hazards
precision_tier: exploratory
capability_requirements:
  required:
  - 'dns_public_lookup'
  - 'passive_dns'
  optional:
  - 'reverse_dns_lookup'
  - 'hosting_provider_classification'
hazards:
- Provider default PTR names, recycled hostnames, and cloud templates can create common reverse-DNS values across unrelated hosts.
- Corroborate PTR reuse with DNS timing, service banners, certificates, and hosting context; reverse DNS alone is weak.
- Provider-managed naming schemes need negative controls; do not infer tenant identity or control from PTR text alone.
name: Reverse DNS Hostname -> Host Cluster
category: OSINT
description: Cluster hosts reusing uncommon PTR or reverse-DNS hostnames while filtering commodity provider naming patterns.
source: inet:fqdn
target: inet:ipv4|inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: reverse_resolves
  direction: out
  form: inet:ipv4
- via: hosts
  direction: out
  form: inet:ipv4|inet:fqdn
constraints:
  temporal:
    order:
    - ptr.seen <= ipv4.seen <= host.seen
    window_days: 365
  degree_caps:
    inet:fqdn: 10000
  negative_nodes:
  - form: inet:fqdn
    list: provider_reverse_dns_zones
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- dns
- pdns
