id: CTI_SBL_HOSTING_RISK
version: 3.0.0
pattern_schema_version: 1.5
validation_state: deferred
deferred_reason: needs_fixtures
precision_tier: exploratory
capability_requirements:
  required:
  - 'explicit_successor_selection'
  optional:
  - 'passive_dns'
  - 'hosting_provider_classification'
hazards:
- Deprecated compatibility definition without executable semantics. Select the IP listing, explicit ASN listing, or ASN-associated infrastructure successor; no automatic rewrite is valid.
- Abuse blocklists, SBL entries, and hosting ASN reputation can lag cleanup or reflect one customer inside shared infrastructure.
- Corroborate listing history with current observations; risk scoring should not label all tenants of a provider as malicious.
- Provider-level reputation is hosting-risk context only and must not be treated as tenant-specific maliciousness, ownership, or control.
name: Deprecated IP/ASN Hosting Reputation Compatibility Definition
category: CTI
description: Retained historical identifier only. Use CTI_IP_TO_LISTING_ASSERTIONS for publisher assertions about an IP, CTI_ASN_TO_EXPLICIT_LISTING_ASSERTIONS for assertions explicitly naming an ASN, or CTI_ASN_TO_LISTED_INFRASTRUCTURE for separately evidenced ASN-associated listed infrastructure. No scoring, provider-wide risk, tenant inference, or executable traversal is defined here.
source: inet:ipv4
target: net:asn
assessment_mode: evidence_only
hops:
- via: bgp_origin|asn_of
  direction: out
  form: net:asn
- via: reputation_of
  direction: out
  form: reputation:list
constraints:
  provenance:
    min_unique_sources: 1
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- bgp
- spamhaus
- abuse_ch
