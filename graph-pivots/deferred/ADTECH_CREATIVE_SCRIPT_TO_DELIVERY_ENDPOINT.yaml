- via: yields_evidence_for
  direction: out
  form: inet:url|evidence:creative_reference
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- browser_telemetry
- proxy_logs
- osint_web
- adtech_logs
