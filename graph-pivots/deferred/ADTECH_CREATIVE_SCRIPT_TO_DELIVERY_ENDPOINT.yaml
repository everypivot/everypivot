- Shared scripts and endpoints do not transfer creative correspondence or establish
  advertiser control, maliciousness or accepted assessment.
name: Creative Script -> Delivery Endpoint
category: ADTECH
description: Find distinct source-qualified creative URI references or actual creative-associated
  requests, directly or through an exactly corresponding script. Preserve request
  stage, generic URI and suitable URL views without inferring advertiser control or
  delivery success.
source: web:creative
target: inet:url|evidence:creative_reference
assessment_mode: evidence_only
