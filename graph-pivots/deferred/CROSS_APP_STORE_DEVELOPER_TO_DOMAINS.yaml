id: CROSS_APP_STORE_DEVELOPER_TO_DOMAINS
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: insufficient_hazards
precision_tier: exploratory
capability_requirements:
  required:
  - 'app_store_metadata_collection'
  - 'dns_public_lookup'
  optional:
  - 'web_content_collection'
  - 'package_metadata_collection'
hazards:
- Shared SDKs, analytics, ad networks, and support vendors can make unrelated developer apps reference common domains.
- Developer-account or store metadata can be stale, transferred, or reseller-managed; corroborate with app package content and current domain control.
- Store developer links can reflect acquired accounts, white-label apps, or outsourced support; do not infer operator control without package and domain evidence.
name: App Store Developer -> Domains
category: CROSS
description: Connect app-store developer accounts to websites, APIs, and support domains referenced by their published applications.
source: app:developer
target: inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: publishes
  direction: out
  form: app:mobile
- via: references|hosts
  direction: out
  form: inet:fqdn
constraints:
  temporal:
    order:
    - developer.firstseen <= app.firstseen <= fqdn.seen
    window_days: 1825
  degree_caps:
    app:developer: 2000
  negative_nodes:
  - form: app:developer
    list: major_app_marketplace_publishers
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- app_store
- osint_web
- pdns
