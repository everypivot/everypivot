id: CROSS_PACKAGE_REPO_TO_DOMAIN_INFRA
version: 3.0.0
pattern_schema_version: 1.6
validation_state: deferred
deferred_reason: needs_fixtures
precision_tier: exploratory
capability_requirements:
  required:
  - semantic_execution_contract_v1
  - preserved_version_declaration
  - explicit_relationship_observation
  - scoped_repository_control_evaluation
  - 'package_metadata_collection'
  - 'repo_resolution'
  optional:
  - 'dns_public_lookup'
  - 'passive_dns'
hazards:
- 'A version-specific registry declaration establishes a declared source-repository association, not verified build provenance or repository ownership.'
- 'Preserve the exact package version, registry metadata revision, source, acquisition time, and revision-link evidence; mirrors and current HEAD cannot replace an unresolved version-to-source binding.'
- 'A repository commit ID and source-snapshot SHA-256 identify the recorded revision and content; neither proves that the package was built from that content.'
- 'The explicit 3650-day UTC window dates the bound infrastructure observation. Replay and later ingestion do not supply another observation or independent source.'
- Package registries, mirrors, CDNs, and abandoned repositories can link unrelated projects to shared distribution infrastructure.
- Corroborate repository ownership with signed releases, maintainer history, and current DNS or hosting control before clustering.
- Promotion requires negative controls for registry, CDN, provider-owned infrastructure, abandoned repositories, and fork or mirror relationships.
name: Repo -> Package -> Domain or Infra
category: CROSS
description: Find package versions whose registry metadata declares the source repository, then follow independently evidenced package distribution or reference infrastructure; preserve the declaration and any exact source-snapshot binding.
source: code:repo
