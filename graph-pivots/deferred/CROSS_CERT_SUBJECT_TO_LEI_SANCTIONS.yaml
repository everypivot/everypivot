id: CROSS_CERT_SUBJECT_TO_LEI_SANCTIONS
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: missing_negative_controls
precision_tier: exploratory
capability_requirements:
  required:
  - 'certificate_normalization'
  - 'lei_resolution'
  - 'sanctions_list_access'
  optional:
  - 'certificate_subject_normalization'
  - 'entity_normalization'
hazards:
- Certificate subject organization fields are free-form, CA-normalized, common, or attacker-controlled and can collide with same-name legal entities.
- Sanctions and LEI joins are temporal and entity-resolution sensitive; corroborate current legal records and certificate ownership before risk scoring.
- Suppress generic, same-name, and CA-normalized certificate subjects before treating a certificate subject as a sanctioned legal entity.
name: Cert Subject Org → LEI → Sanctions
category: CROSS
description: Extract certificate subject/organization, map to LEI, and screen against sanctions.
source: x509:cert
target: sanction:entry
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: subject_org
  direction: out
  form: org:org
- via: has_lei
  direction: out
  form: lei:record
- via: listed_as
  direction: out
  form: sanction:entry
constraints:
  temporal:
    order:
    - cert.not_before <= sanction.listed
    window_days: 3650
  degree_caps:
    x509:cert: 10000
  negative_nodes:
  - form: x509:cert
    list: free_or_shared_ca_default_subjects
  - form: x509:cert
    list: generic_certificate_subject_orgs
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- ct
- lei
- sanctions
