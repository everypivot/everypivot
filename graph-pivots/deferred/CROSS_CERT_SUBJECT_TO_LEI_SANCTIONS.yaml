  direction: out
  form: lei:record
- via: listed_as
  direction: out
  form: sanction:entry
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- ct
- lei
- sanctions
