id: CROSS_CERT_SUBJECT_TO_LEI_SANCTIONS
version: 3.0.0
pattern_schema_version: 1.6
validation_state: deferred
deferred_reason: missing_negative_controls
precision_tier: exploratory
capability_requirements:
  required:
  - certificate_normalization
  - lei_resolution
  - sanctions_list_access
  - semantic_execution_contract_v1
  - source_revision_scoped_relations
  - explicit_temporal_applicability
  - amendment_context
  optional:
  - certificate_subject_normalization
  - entity_normalization
hazards:
- Certificate subject organization fields are free-form, CA-normalized, common, or
  attacker-controlled and can collide with same-name legal entities.
- Sanctions and LEI joins are temporal and entity-resolution sensitive; corroborate
  current legal records and certificate ownership before risk scoring.
- Suppress generic, same-name, and CA-normalized certificate subjects before treating
  a certificate subject as a sanctioned legal entity.
- Source-reported identity, relationship and list status require separate evidence;
  no traversal supplies legal exposure, liability, control, source independence or
  accepted assessment status.
- A selected historical-status inquiry requires the actual applicable relationship
  and list intervals. Later publication, receipt and correction do not backdate analyst
  knowledge or refresh activity.
name: Certificate Subject → Evidenced Legal Entity → Sanctions Entries
category: CROSS
description: Follow a preserved certificate subject assertion through evidenced legal-entity
  correspondence to selected sanctions entry revisions. A certificate name alone supplies
  no entity resolution, ownership or control; retrospective material reference has
  no invented activity date.
source: x509:cert
target: sanction:entry
assessment_mode: evidence_only
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
