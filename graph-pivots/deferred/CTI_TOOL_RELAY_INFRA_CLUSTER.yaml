id: CTI_TOOL_RELAY_INFRA_CLUSTER
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: insufficient_hazards
precision_tier: exploratory
capability_requirements:
  required:
  - 'tool_family_normalization'
  - 'passive_dns'
  optional:
  - 'asn_enrichment'
  - 'hosting_provider_classification'
hazards:
- Relay infrastructure may use shared VPNs, proxies, cloud providers, or commodity tooling reused by unrelated operators.
- Corroborate ASN and PDNS co-location with temporal overlap and tool-specific evidence; common hosting is a false-positive source.
- Relay co-location should be suppressed for provider VPN, proxy, and cloud infrastructure and is not proof of operator ownership.
name: Tool Family → Relay/Proxy Infra Cluster
category: CTI
description: Find relay infrastructure linked to a tool family via shared hosting, ASN, and pdns co-location.
source: it:prod:soft
target: inet:ipv4|inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: communicates|relays_through
  direction: out
  form: inet:ipv4|inet:fqdn
- via: bgp_origin|asn_of
  direction: out
  form: net:asn
- via: announces|hosts_many
  direction: out
  form: inet:ipv4
constraints:
  temporal:
    order:
    - tool.firstseen <= infra.seen
    window_days: 540
  degree_caps:
    net:asn: 1000
  negative_nodes:
  - form: net:asn
    list: known_scanner_asns
  - form: inet:ipv4
    list: shared_hosting_ranges
  provenance:
    min_unique_sources: 2
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- pdns
- bgp
- siem
