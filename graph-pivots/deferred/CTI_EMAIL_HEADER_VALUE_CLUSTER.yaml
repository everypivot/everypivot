id: CTI_EMAIL_HEADER_VALUE_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
validation_state: deferred
deferred_reason: needs_fixtures
precision_tier: exploratory
robustness_class: multi_hop_inference
hazards:
- 'Email header values can be spoofed, rewritten, normalized, stripped, or generated by common mail software.'
- 'Headers can contain personal data, internal hostnames, or tenant-specific values that require minimization.'
- 'Header-value reuse is weak unless the value is rare and corroborated by attachment, sender, URL, or relay evidence.'
capability_requirements:
  required:
  - email_header_parsing
  - header_value_normalization
  - semantic_execution_contract_v1
  - preserved_extraction_v1
  - exact_content_hash_reproduction
  - complete_finding_history
  - scoped_control_evaluation
  optional:
  - privacy_minimization
  - message_body_context
name: Email Header Value Cluster
category: CTI
description: Find preserved message captures containing the selected header value
  in the selected header name and actual field occurrence. Original, gateway and export
  representations remain distinct evidence; receipt is not extraction or knowledge
  time.
source: email:header:value
target: email:message
assessment_mode: evidence_only
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_EMAIL_HEADER_VALUE_CLUSTER.json
  sha256: 6638c9e648211cc7a11ce82aef2b79f7f843407dbebc25423cd5aa9cc9dc8310
hops:
- via: header_value_present
  direction: in
  form: email:message
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- mail_telemetry
