id: IO_SHARED_SHORTENER_OR_TRACKING_CLUSTER
version: 1.0.0
pattern_schema_version: 1.2
validation_state: deferred
deferred_reason: insufficient_hazards
precision_tier: exploratory
capability_requirements:
  required:
  - 'platform_abuse_records'
  - 'redirect_resolution'
  optional:
  - 'web_fingerprinting'
  - 'tracking_id_extraction'
hazards:
- Public shorteners, campaign platforms, and tracking vendors are shared across many unrelated accounts and domains.
- Corroborate redirect and tracking reuse with landing content, timing, and operator-controlled artifacts; expect false positives.
- Shared vendor IDs, link shorteners, and hosted tracking platforms need suppression before any campaign or operator-control claim.
name: Shortener or Tracking Domain -> IO Property Cluster
category: IO
description: Cluster IO properties reusing the same shortener, redirector, or campaign-tracking domain across accounts or sites.
source: inet:fqdn
target: inet:web:acct|inet:fqdn
assessment:
  claim: indicates
  basis: assessed
  scope: entity_level
hops:
- via: embedded_in
  direction: out
  form: web:url
- via: posted_by|redirects_to
  direction: out
  form: inet:web:acct|inet:fqdn
constraints:
  temporal:
    order:
    - tracker.seen <= url.seen <= property.seen
    window_days: 365
  degree_caps:
    inet:fqdn: 2000
  negative_nodes:
  - form: inet:fqdn
    list: mainstream_link_shorteners
  provenance:
    min_unique_sources: 1
features:
- path_length
- rarity_idf
- path_count_capped
- vendor_diversity
- multi_source_ratio
- temporal_consistency
- days_since_support
- popular_tool_penalty
- novelty_flag
outputs:
  top_paths: 3
  yield:
  - source
  - target
  - features
  - evidence_paths
  - storm_query
datasets:
- social
- osint_web
