id: CTI_AUTHENTICODE_HASH_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_AUTHENTICODE_HASH_CLUSTER.json
  sha256: f0ef1392f2af63d561fe89752a19c6a44ef742b130fcae50e021dd597c97c1cb
validation_state: deferred
deferred_reason: needs_fixtures
precision_tier: exploratory
robustness_class: multi_hop_inference
hazards:
- 'Equal image-content digests do not establish identical complete files, signatures, signers or behaviour. Image findings need no manufactured certificate or successful signature check.'
- 'Primary, timestamp, chain and other material roles remain distinct. Timestamp material equality does not establish a verified timestamp or primary signer identity.'
- 'A selected artifact-derived reference needs its own exact relationship evidence and knowledge scope. Candidate matches cannot repair a missing reference join.'
- 'Synthetic portable fixtures do not establish native adapter acceptance, source authenticity or lane promotion.'
- 'Certificate presence, reported signer association and a scoped source-reported check are distinct claims; this evaluator does not perform cryptographic signature verification.'
- 'Whole-artifact, scheme-covered content, whole-certificate, SPKI and issuer/serial identities are distinct. Reuse establishes neither publisher trust, control, common ownership nor accepted assessment.'
- 'Only an actual complete-finding establishment in the supplied collection history is dated. Reprocessing, receipt, validity dates and new sightings do not renew an older finding.'
- 'Credential class is retained as context by default. Explicit selected class policies preserve unknown and conflicting evidence; a public certificate does not establish public access to its private key.'
- 'Correction and withdrawal context is retained without replacing or refreshing the historical finding; absence of a supplied amendment does not establish maintained current support.'
capability_requirements:
  required:
  - 'semantic_evidence_v1'
  - 'typed_artifact_and_material_identity'
  - 'source_qualified_signing_or_digest_evidence'
  - 'collection_finding_history'
  - 'scoped_amendment_context'
  optional:
  - 'authenticode_metadata_extraction'
  - 'scoped_signature_verification_reports'
  - 'credential_classification_with_revision'
  - 'collection_knowledge_witnesses'
name: Typed Authenticode, Signature Material or Certificate → File Findings
category: CTI
description: 'Return exact file findings for an explicitly selected image-content digest, scoped signature-material digest, or certificate/key/issuer-serial relationship purpose. Candidate complete-finding availability uses a case-selected period; a separately evidenced historical artifact reference does not refresh candidate novelty. Certificate witnesses stay attached to their file findings rather than becoming an assumed terminal result.'
source: code:authenticode:hash|code:signature:material|x509:cert
target: file:hash
assessment_mode: evidence_only
hops:
- via: has_typed_comparison_finding
  direction: out
  form: file:hash
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- malware_corpus
- sandbox
- code_signing_metadata
