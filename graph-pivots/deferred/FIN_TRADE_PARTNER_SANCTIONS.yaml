id: FIN_TRADE_PARTNER_SANCTIONS
version: 3.0.0
pattern_schema_version: 1.6
validation_state: deferred
deferred_reason: restricted_data_access
precision_tier: exploratory
capability_requirements:
  required:
  - financial_records
  - sanctions_list_access
  - semantic_execution_contract_v1
  - source_revision_scoped_relations
  - explicit_temporal_applicability
  - amendment_context
  optional:
  - trade_record_normalization
  - beneficial_ownership_resolution
hazards:
- Trade counterparties, shared intermediaries, ownership chains, and sanctions lists
  change over time and vary by jurisdiction.
- Corroborate shipment date, beneficial ownership, and account or payment context;
  avoid false positives from same-name or intermediary partners.
- Trade, shipment, payment, and counterparty records may be commercially sensitive
  or restricted and need explicit governance before use.
- Source-reported identity, relationship and list status require separate evidence;
  no traversal supplies legal exposure, liability, control, source independence or
  accepted assessment status.
- A selected historical-status inquiry requires the actual applicable relationship
  and list intervals. Later publication, receipt and correction do not backdate analyst
  knowledge or refresh activity.
name: Trade Event → Partner Sanctions Entries
category: FIN
description: Follow an individual reported trade event between the selected organization
  and an evidenced partner to selected sanctions entry revisions. A transaction report
  is distinct from a standing trade relationship and from status at the event time.
