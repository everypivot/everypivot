hazards:
- Public kits, generic paths and shared components can connect unrelated deployments;
  actual correspondence must remain scoped.
- A matching archive offered for download, bare request, DNS record or peer address
  does not establish deployment of its contents.
- Research/test/sinkhole controls apply to the evidenced occurrence; shared hosting
  is context, not blanket exclusion.
- Receipt and source-reported substantive derivation guide search only; copies do
  not create deployment, novelty, independent origins or actor identity.
name: Phish Kit → Hosting Domain/IP Cluster
category: CTI
description: Compare preserved kit representations, then require separately evidenced
  deployment of the same candidate for infrastructure results. Preserve generic/component
  clues and explicit baseline references; 180 days guides evidence search priority,
  not activity eligibility.
