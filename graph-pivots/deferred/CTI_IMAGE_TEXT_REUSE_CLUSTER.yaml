id: CTI_IMAGE_TEXT_REUSE_CLUSTER
version: 3.0.0
pattern_schema_version: 1.6
validation_state: deferred
deferred_reason: needs_fixtures
precision_tier: exploratory
robustness_class: multi_hop_inference
hazards:
- Stock imagery, memes, common logos, boilerplate text, reused screenshots, and public templates can overcluster unrelated actors or campaigns.
- OCR output is sensitive to language, font, compression, cropping, watermarking, and model or extractor version.
- Bounded semantic descriptions are model- and prompt-dependent; any future use must record extractor and prompt version before promotion.
- Image-derived text reuse is a weak lead and must not be treated as common control or attribution without independent corroboration.
capability_requirements:
  required:
  - image_extraction
  - ocr_extraction
  - text_normalization
  - semantic_execution_contract_v1
  - preserved_extraction_v1
  - exact_content_hash_reproduction
  - complete_finding_history
  - scoped_control_evaluation
  optional:
  - perceptual_hashing
  - bounded_image_description
  - language_detection
name: Image Text Reuse Cluster
category: CTI
description: Find the particular preserved images whose evidenced OCR output has the
  selected digest. A page result separately requires the exact page capture and image
  association; crops and renders retain their own identities.
source: image:ocr:text_hash
target: file:image|inet:url
assessment_mode: evidence_only
execution:
  contract: everypivot.semantic_pattern
  version: '1.0'
  path: contracts/semantics/CTI_IMAGE_TEXT_REUSE_CLUSTER.json
  sha256: 2429a9a957e11d1267ae69ea89a81b0a28e5c24f4b33be9bedea61377c9ec587
hops:
- via: ocr_text_extracted_from
  direction: in
  form: file:image
- via: image_observed_on
  direction: out
  form: inet:url
constraints:
  provenance:
    min_unique_sources: 1
features: []
outputs:
  yield:
  - source
  - target
  - evidence_paths
datasets:
- image_corpus
- osint_web
