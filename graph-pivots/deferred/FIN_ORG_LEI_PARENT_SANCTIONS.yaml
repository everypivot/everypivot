hazards:
- LEI parent relationships, shared holding structures, and sanctions lists can lag
  restructures, ownership changes, or jurisdiction-specific legal interpretations.
- Corroborate temporal ownership, control, and sanctions effective dates; do not treat
  a parent link as automatic prohibited activity.
- LEI ownership chains, beneficial-ownership disclosures, and sanctions-list access
  may be jurisdiction-restricted or commercially sensitive and require governance
  review before risk scoring.
- Source-reported identity, relationship and list status require separate evidence;
  no traversal supplies legal exposure, liability, control, source independence or
  accepted assessment status.
- A selected historical-status inquiry requires the actual applicable relationship
  and list intervals. Later publication, receipt and correction do not backdate analyst
  knowledge or refresh activity.
